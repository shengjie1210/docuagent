server:
  port: 8080

spring:
  application:
    name: business-assistant
  datasource:
    url: jdbc:mysql://localhost:3306/docuagent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
#   data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.business_assistant.bean
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 业务自定义配置
docuagent:
  jwt-secret: ${JWT_SECRET:docuagent-default-secret-key-must-be-changed-in-production-2026}
  jwt-expire: 7200000
  # 管理后台共享管理员密码（所有用户输入此密码即可解锁，默认 123456）
  admin-password: ${ADMIN_PASSWORD:123456}
  upload-dir: ./upload
  vector-store-path: ./data/vectors.json
  # RAG 检索调参（实战项目可观测、可调）
  chunk-size: 800           # 每个 chunk 最大字符数（管理员可在后台热更新）
  top-k: 4                  # 最终返回给模型/前端的 chunk 数
  similarity-threshold: 0.55  # 相似度阈值，低于此分数直接丢弃
  max-chunks-per-doc: 2       # 同一文档最多保留几个 chunk，避免刷屏

# Spring AI（阿里云 MaaS，OpenAI 兼容接口）
spring.ai:
  openai:
    base-url: https://ws-nmbnvgdg7ik8s0gk.cn-beijing.maas.aliyuncs.com/compatible-mode
    api-key: sk-ws-H.YXMXMLH.VKBe.MEYCIQCQ08e7IqaqwfOYRwxho3cLXUy0SMSOak-nY8ygfDYxnQIhAKlGtqpUhnl5fU_OwRbwv-TH3ejRp00ix-zu-sUo8vEU
    chat:
      options:
        model: qwen-plus
    embedding:
      options:
        model: text-embedding-v3

logging:
  level:
    com.example.business_assistant: info
    org.mybatis: warn
    java.sql: warn






server.compression.enabled: false

